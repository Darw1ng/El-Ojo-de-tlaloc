# Publica la historia NISAR (frontend/nisar) en GitHub Pages en cada push a main que la toque.
# Requiere una sola vez: Settings > Pages > Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/nisar/**"
      - "frontend/vendor/**"
      - "scripts/sitio_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}nisar/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sitio_pages.py _sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
